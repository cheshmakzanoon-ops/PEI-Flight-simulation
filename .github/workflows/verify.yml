name: Verify flight build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flight-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Flight tests, world data and web build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node tools/verify-world.mjs
      - run: npm run check
      - name: Install browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps --only-shell chromium
      - name: Smoke test the built flight simulator
        run: |
          set -euo pipefail
          mkdir -p artifacts/smoke
          npm run preview -- --host 127.0.0.1 --strictPort > artifacts/smoke/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for try in {1..20}; do curl --silent --fail http://127.0.0.1:4173/ > /dev/null && break; sleep 0.3; done
          curl --fail --silent --show-error http://127.0.0.1:4173/world/terrain.json > /dev/null
          node tools/browser-smoke.mjs 2>&1 | tee artifacts/smoke/browser.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: browser-smoke-screenshots
          path: artifacts/smoke
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: pei-flight-sim-web
          path: dist
          if-no-files-found: error
          retention-days: 14

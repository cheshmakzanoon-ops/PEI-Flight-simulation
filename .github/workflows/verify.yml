name: Verify flight build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Preserve a receipt per published commit; supersede intermediate PR checks.
  group: flight-build-${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check sources, signed world and build
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node tools/verify-world.mjs
      - run: npm run check
      - run: node --experimental-strip-types --test tools/art/north-rustico-fish-house-study/*.test.mjs tools/art/north-rustico-doiron-storefront/*.test.mjs tools/art/boardwalk-timber/*.test.mjs tools/art/georgetown-inn-kent-gable/*.test.mjs
      - name: Verify the detached Souris St. Mary’s study
        run: |
          node --experimental-strip-types tools/art/souris-st-mary-study/souris-st-mary-test.mjs > /tmp/souris-st-mary-geometry.json
          cmp tools/art/souris-st-mary-study/st-marys-detached-exact-buffers.json /tmp/souris-st-mary-geometry.json
          node --experimental-strip-types --test tools/art/souris-st-mary-study/stone-program.test.mjs
          node --experimental-strip-types tools/art/souris-st-mary-study/lancets/check-lancet-geometry.mjs > /tmp/souris-st-mary-lancets.json
          cmp tools/art/souris-st-mary-study/proof/lancet-geometry.json /tmp/souris-st-mary-lancets.json
          ./node_modules/.bin/tsc -p tools/art/souris-st-mary-study/tsconfig.json
          ./node_modules/.bin/vite build tools/art/souris-st-mary-study --config tools/art/souris-st-mary-study/vite.config.ts --outDir /tmp/souris-st-mary-studio-dist --emptyOutDir
      - name: Verify native scenery ownership and frame gates
        run: node --disable-warning=ExperimentalWarning --experimental-transform-types --test tools/qa/scenery-owner-preflight.test.mjs tools/qa/scenery-frame-invariant.test.mjs tools/qa/indian-river-terrain-lens.test.ts tools/qa/kings-ridge-flight-lens.test.ts
      - name: Verify the North Cape stand comparison and its stock fallback
        run: node --no-warnings --experimental-transform-types --import ./test/private-stock-loader.mjs --test test/north-cape-stand-private.test.mjs
      - name: Verify the off-map Holman Centre asset
        run: |
          node --experimental-strip-types --test tools/art/holman-centre-exterior/holman-detached-portable.test.mjs
          ./node_modules/.bin/tsc -p tools/art/holman-centre-exterior/tsconfig.json
          ./node_modules/.bin/vite build tools/art/holman-centre-exterior --base ./ --outDir /tmp/pei-holman-studio-dist --emptyOutDir
      - name: Verify detached Founders’ Food Hall art
        run: |
          node --experimental-strip-types --test tools/art/founders-hall-exterior/detached.test.mjs tools/art/founders-hall-exterior/west-clip.test.mjs
          ./node_modules/.bin/tsc -p tools/art/founders-hall-exterior/tsconfig.json
          ./node_modules/.bin/vite build tools/art/founders-hall-exterior --base ./ --outDir /tmp/pei-founders-studio-dist --emptyOutDir
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-dist-unverified
          path: dist
          if-no-files-found: error
          retention-days: 1

  browser:
    name: Browser replay / ${{ matrix.lane }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ (matrix.lane == 'oleary-access-roof' || matrix.lane == 'runway03-pavement') && 19 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        lane: [core, terminal, oleary, indian-river, farmland, cape-stone, cape-water, souris-west, oleary-access-roof, montague-bridge, runway03-pavement, east-point-phase-ii, georgetown-school-walls, rustico-lighthouse]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-dist-unverified
          path: dist
          digest-mismatch: error
      - name: Install browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1 pngjs@7.0.0
          npx playwright install --with-deps --only-shell chromium
      - name: Smoke test the same compiled player
        env:
          REPLAY_LANE: ${{ matrix.lane }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/smoke
          npm run preview -- --host 127.0.0.1 --strictPort > artifacts/smoke/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for try in {1..20}; do curl --silent --fail http://127.0.0.1:4173/ > /dev/null && break; sleep 0.3; done
          curl --fail --silent --show-error http://127.0.0.1:4173/world/terrain.json > /dev/null
          case "$REPLAY_LANE" in
            core)
              PEI_BROWSER_CORE_ONLY=1 node tools/browser-smoke.mjs
              ./node_modules/.bin/vite --host 127.0.0.1 --port 4174 --strictPort > artifacts/smoke/souris-st-mary-server.log 2>&1 &
              studio_pid=$!
              trap 'kill "$server_pid" "$studio_pid" 2>/dev/null || true' EXIT
              studio_url='http://127.0.0.1:4174/tools/art/souris-st-mary-study/'
              for try in {1..20}; do curl --silent --fail "$studio_url" > /dev/null && break; sleep 0.3; done
              curl --fail --silent --show-error "$studio_url" > /dev/null
              node tools/art/souris-st-mary-study/browser-smoke.mjs
              ;;
            terminal) node tools/terminal-wall-smoke.mjs ;;
            oleary) node tools/oleary-neighborhood-smoke.mjs ;;
            indian-river) node tools/indian-river-smoke.mjs ;;
            farmland) node tools/mapped-farmland-smoke.mjs ;;
            cape-stone) node tools/cape-tryon-rock-smoke.mjs ;;
            cape-water) node tools/cape-tryon-water-smoke.mjs ;;
            souris-west) node tools/souris-west-facing-smoke.mjs ;;
            oleary-access-roof) node tools/oleary-access-roof-smoke.mjs ;;
            montague-bridge) node tools/montague-bridge-pass-smoke.mjs ;;
            runway03-pavement) node tools/cyyg03-pavement-smoke.mjs ;;
            east-point-phase-ii) node tools/east-point-phase-ii-smoke.mjs ;;
            georgetown-school-walls) node tools/georgetown-school-walls-smoke.mjs ;;
            rustico-lighthouse) node tools/rustico-lighthouse-smoke.mjs ;;
            *) exit 2 ;;
          esac 2>&1 | tee "artifacts/smoke/$REPLAY_LANE.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: browser-smoke-${{ matrix.lane }}
          path: artifacts/smoke
          if-no-files-found: ignore
          retention-days: 7

  verified:
    name: Flight tests, world data and web build
    needs: [build, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-dist-unverified
          path: dist
          digest-mismatch: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: pei-flight-sim-web
          path: dist
          if-no-files-found: error
          retention-days: 14

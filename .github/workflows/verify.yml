name: Verify flight build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Preserve a receipt per published commit; supersede intermediate PR checks.
  group: flight-build-${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Flight tests, world data and web build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node tools/verify-world.mjs
      - run: npm run check
      - run: node --experimental-strip-types --test tools/art/north-rustico-fish-house-study/*.test.mjs tools/art/north-rustico-doiron-storefront/*.test.mjs tools/art/boardwalk-timber/*.test.mjs tools/art/georgetown-inn-kent-gable/*.test.mjs
      - name: Install browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1 pngjs@7.0.0
          npx playwright install --with-deps --only-shell chromium
      - name: Smoke test the built flight simulator
        run: |
          set -euo pipefail
          mkdir -p artifacts/smoke
          npm run preview -- --host 127.0.0.1 --strictPort > artifacts/smoke/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for try in {1..20}; do curl --silent --fail http://127.0.0.1:4173/ > /dev/null && break; sleep 0.3; done
          curl --fail --silent --show-error http://127.0.0.1:4173/world/terrain.json > /dev/null
          # Keep receipts for independent routes even if one is red; the
          # playable archive still requires every verification to succeed.
          result=0
          node tools/terminal-wall-smoke.mjs 2>&1 | tee artifacts/smoke/summerside-terminal.log || result=1
          PEI_BROWSER_CORE_ONLY=1 node tools/browser-smoke.mjs 2>&1 | tee artifacts/smoke/browser.log || result=1
          node tools/oleary-neighborhood-smoke.mjs 2>&1 | tee artifacts/smoke/oleary-neighborhood.log || result=1
          node tools/indian-river-smoke.mjs 2>&1 | tee artifacts/smoke/indian-river.log || result=1
          node tools/mapped-farmland-smoke.mjs 2>&1 | tee artifacts/smoke/mapped-farmland.log || result=1
          exit "$result"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: browser-smoke-screenshots
          path: artifacts/smoke
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: pei-flight-sim-web
          path: dist
          if-no-files-found: error
          retention-days: 14

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Charlottetown · Flight Service Station exterior review</title>
  <style>
  :root{color-scheme:light;--ink:#152327;--quiet:#52656a;--line:#d7dedb;--paper:#f3f5f0;--white:#fff}
  *{box-sizing:border-box}
  body{margin:0;padding:36px clamp(18px,5vw,76px);color:var(--ink);background:var(--paper);font:15px/1.55 system-ui,sans-serif}
  main{max-width:1320px;margin:auto}
  header{padding:0 0 22px}
  .kicker{margin:0 0 9px;color:var(--quiet);font-weight:700;font-size:.76rem;text-transform:uppercase;letter-spacing:.12em}
  h1{font-size:clamp(1.8rem,4vw,3.6rem);line-height:1.03;margin:0 0 12px;letter-spacing:-.045em}
  p{max-width:58rem;margin:.65em 0}
  aside{color:var(--quiet);margin:20px 0}
  .views{display:grid;grid-template-columns:1.1fr 1fr;gap:14px}
  figure{border:1px solid var(--line);margin:0;min-width:0;background:var(--white)}
  figcaption{padding:13px 15px;border-bottom:1px solid var(--line);font-weight:650}
  .window{width:100%;aspect-ratio:1.38;background:#cbdbe3;position:relative}
  canvas{display:block;width:100%;height:100%}
  .caption{display:block;color:var(--quiet);font-size:.87rem;font-weight:440}
  nav{display:flex;flex-wrap:wrap;gap:6px;margin-top:13px}
  button{padding:8px 13px;border:1px solid var(--line);background:var(--white);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;border-radius:4px}
  button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--white)}
  button:focus-visible{outline:2px solid #136876;outline-offset:3px}
  [role=status]{font-size:.87rem;color:var(--quiet);margin-top:14px}
  @media(max-width:720px){body{padding-top:22px}.views{grid-template-columns:1fr}}
  </style>
</head>
<body>
<main>
  <header>
    <p class="kicker">PEI Flight Sim · Exterior review</p>
    <h1>Charlottetown Flight Service Station</h1>
    <p>A detached Three.js study of the public exterior. The proportions are not a survey, and the live flight simulator is unchanged.</p>
    <nav id="angles" aria-label="Daylight review angle"></nav>
  </header>
  <div class="views">
    <figure>
      <figcaption>Daylight review <span class="caption">Inspect the shaft, canted cab, and annex from more than one side.</span></figcaption>
      <div id="hero" class="window"></div>
    </figure>
    <figure>
      <figcaption>Flight-size silhouette <span class="caption">Illustrated at approximately 75 pixels, the height of the stock Chase subject.</span></figcaption>
      <div id="flight" class="window"></div>
    </figure>
  </div>
  <div id="status" role="status"></div>
</main>
<script type="module" src="./src/studio.ts"></script>
</body>
</html>

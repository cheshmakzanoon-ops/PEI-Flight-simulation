<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>PEI Flight Sim: aircraft visual fixture</title>
<style>body{margin:0;background:#b1c7d3}</style>
<script type="module">
import * as T from 'three';
import { createAircraft } from '/src/render/aircraft.ts';
import {SURVEY_AIRFRAME} from '/src/sim/flight.ts';
const params=new URLSearchParams(location.search);
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
const scene=new T.Scene();
scene.background=new T.Color(0xb1c7d3);
const width=1160,height=740;
renderer.setSize(width,height);
renderer.toneMapping=T.ACESFilmicToneMapping;
renderer.shadowMap.enabled=true;
document.body.append(renderer.domElement);
const {root,prop,cockpit,setInterior,setProp,setControls,controlAngles,setAltitude,altitudeAngles}=createAircraft();
const pose=params.get('pose');
const amount=Math.max(0,Math.min(1,Number(params.get('prop')??0)));
const inCockpit=pose==='cockpit';
setInterior(inCockpit);
if(['prop','prop-side','chase','cockpit'].includes(pose))prop.rotation.z=Math.PI;
setProp(amount);scene.add(root);
if(inCockpit)setAltitude(Number(params.get('altitude')??0));
if(pose==='surfaces'){
  const roll=Number(params.get('roll')??0),pitch=Number(params.get('pitch')??0);
  for(let i=0;i<60;i++)setControls({roll,pitch},1/60);
}
scene.add(new T.HemisphereLight(0xd2e8ff,0x9c8f68,1.5));
const sun=new T.DirectionalLight(0xffe1ab,2.5);
sun.position.set(-12,24,-16);sun.castShadow=true;
Object.assign(sun.shadow.camera,{left:-10,right:10,top:10,bottom:-10,near:12,far:50});
sun.shadow.camera.updateProjectionMatrix();
sun.shadow.mapSize.set(2048,2048);sun.shadow.normalBias=.045;sun.shadow.bias=-.00015;
scene.add(sun);
const ground=new T.Mesh(new T.PlaneGeometry(120,120),new T.MeshStandardMaterial({color:0x5d6059}));
ground.rotation.x=-Math.PI/2;ground.position.y=-1.401;ground.receiveShadow=true;scene.add(ground);
const camera=new T.PerspectiveCamera(36,width/height,.05,100);
if(pose==='prop'){camera.position.set(1.75,.15,-9.25);camera.lookAt(0,-.10,-3.9);}
else if(pose==='prop-side'){camera.position.set(-3.25,.15,-7.7);camera.lookAt(0,-.08,-3.82);}
else if(pose==='cockpit'){camera.fov=53;camera.updateProjectionMatrix();camera.position.set(0,.73,-.36);camera.lookAt(0,.71,-50.36);}
else if(pose==='chase'){camera.fov=53;camera.updateProjectionMatrix();camera.position.set(0,4.2,16.8);camera.lookAt(0,1.18,-7.8);}
else if(pose==='gear'){camera.position.set(-5,-.30,-1.6);camera.lookAt(-.42,-.78,-.60);}
else if(pose==='surfaces'){camera.position.set(7.6,4.6,12.7);camera.lookAt(0,.35,.4);}
else if(pose==='windshield'){camera.position.set(3.1,1.63,-5.3);camera.lookAt(0,.78,-.96);}
else{camera.position.set(8,3.8,-11.5);camera.lookAt(0,-.15,-.15);}
renderer.render(scene,camera);
const box=new T.Box3().setFromObject(root);
const hub=new T.Vector3(),point=new T.Vector3();prop.getWorldPosition(hub);
let radius=0,solidTriangles=0;
prop.traverse(o=>{
 if(!o.isMesh)return;
 const p=o.geometry.getAttribute('position');
 solidTriangles+=(o.geometry.index?.count??p.count)/3;
 for(let i=0;i<p.count;i++){
  point.fromBufferAttribute(p,i).applyMatrix4(o.matrixWorld);
  radius=Math.max(radius,Math.hypot(point.x-hub.x,point.y-hub.y));
 }
});
const sweep=root.getObjectByName('Survey propeller • shutter sweep');
window.aircraftPreview={
    pose, altitudeAngles:altitudeAngles(), controlAngles:controlAngles(), commandedProp:amount, cockpitVisible:cockpit.visible, solidVisible:prop.visible,
    sweepVisible:sweep?.visible, bladeSweepM:2*radius,
    clearanceM:hub.y+SURVEY_AIRFRAME.gearHeightM-radius, solidTriangles,
    triangles:renderer.info.render.triangles,
    calls:renderer.info.render.calls,
    min:box.min.toArray(),max:box.max.toArray()
};
</script>
<body></body>
</html>
